[project]
name = "weather-agents"
version = "0.1.0"
description = "Open-Meteo MCP server and weather chat CLI, a study rig for the Anthropic stack."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15,<2",
    "httpx>=0.28",
    "labs-logging",
    "mcp[cli]>=2,<3",
    "pydantic-settings>=2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "coverage>=7",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# labs-logging refuses to configure while pytest's logging plugin holds root handlers.
addopts = "-m 'not live' -p no:logging"
markers = [
    "live: calls the real Open-Meteo API or the real Anthropic API",
]

[tool.uv.sources]
labs-logging = { workspace = true }
