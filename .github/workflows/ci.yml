name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make install
      - run: make pre-commit-verify

  packages-discovery:
    name: packages-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.list-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list-packages
        run: |
          packages="$(for f in packages/*/pyproject.toml; do basename "$(dirname "$f")"; done | jq -R . | jq -cs .)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

  test:
    name: test (${{ matrix.package }})
    needs: packages-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages-discovery.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Run tests
        env:
          PKG: ${{ matrix.package }}
        run: make test PKG="$PKG"
      - name: Coverage summary
        env:
          PKG: ${{ matrix.package }}
        run: |
          cd "packages/$PKG"
          {
            echo "### Coverage: $PKG"
            uvx coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  # Informational: not in ci-success.needs, so a bad message shows red but never blocks a merge.
  conventional-commits:
    name: conventional-commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make conventional-commits-verify BASE="$BASE_SHA" HEAD_REF="$HEAD_SHA"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  osv-scan:
    name: osv-scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=uv.lock
      fail-on-vuln: false

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  ci-success:
    name: ci-success
    if: always()
    needs: [static-checks, packages-discovery, test, dependency-review, osv-scan, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### CI results"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key) (\(.value.result))"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            while IFS= read -r job; do
              echo "::error::Required job did not pass: $job"
            done <<<"$failed"
            exit 1
          fi
