[project]
name = "labs-logging"
version = "0.1.0"
description = "Shared structured logging for Python applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4",
    "pydantic>=2",
    "structlog>=24,<25",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]